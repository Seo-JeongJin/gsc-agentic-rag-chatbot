# nginx 설정 ① — http 전용 (2026-11-11 배포 0-1, 0-2에서 이름 변경: nginx.conf → nginx.http.conf).
#
# 언제 쓰나: **https 인증서를 처음 받기 전**(그리고 https에 문제가 생겨 되돌릴 때). 인증서를 받은 뒤엔 nginx.https.conf를 씀.
#           어느 파일을 쓸지는 .env의 NGINX_CONF로 고름(docker-compose.yml nginx 서비스 참고). 기본값이 이 파일인 이유:
#           인증서가 없는 새 서버에서 https 설정으로 켜면 nginx가 인증서 파일을 못 찾아 계속 죽기 때문.
#
# 하는 일: 외부 80번으로 온 요청을 챗봇(backend 컨테이너 8080)으로 넘기는 "문지기".
# 왜 필요한가: 학교 방화벽이 80·443만 외부에 열어줌. 챗봇은 8080에서 돌기 때문에 80번에서 받아 넘겨줄 프로그램이 필요함.
# 왜 컨테이너인가: 서버에 nginx를 따로 설치하지 않아도 되고(sudo 불필요), 이 설정이 git으로 같이 관리돼서
#                 deploy.sh 한 번으로 챗봇과 함께 갱신됨.
#
# 이 파일은 nginx의 http 블록 안에 포함됨(conf.d/default.conf로 끼움) — 그래서 server_tokens 같은 http 단위 설정도 여기에 둘 수 있음.

# 오류 페이지·응답 헤더에 nginx 버전을 숨김 — 공격자에게 "어떤 버전의 알려진 취약점을 노리면 되는지" 알려주지 않게
server_tokens off;

server {
    listen 80;
    server_name _;   # 어떤 이름으로 들어와도 받음(aihub.yju.ac.kr, IP 직접 접속 모두)

    # 요청 본문 최대 크기 — 질문은 최대 1000자(입력 가드레일, 한글 약 3KB) + JSON이라 64KB면 충분.
    # 큰 요청으로 서버 메모리를 쓰게 만드는 공격을 nginx 단계에서 바로 막음(초과하면 413).
    client_max_body_size 64k;

    # Let's Encrypt 확인 경로(0-2) — 인증서를 받을 때 Let's Encrypt가 외부에서 이 주소로 들어와
    # "certbot이 올려둔 확인 파일"이 보이는지 확인함. 파일은 certbot 컨테이너와 같이 쓰는 볼륨(/var/www/certbot)에 있음.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # "backend"는 docker-compose의 서비스 이름 — 같은 Docker 내부망 안이라 이름으로 찾아감(외부에 8080을 열 필요 없음)
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # 원래 요청 정보를 챗봇에 전달 — 안 넘기면 챗봇은 모든 요청이 nginx 컨테이너에서 온 것으로 봄.
        # X-Forwarded-For: 지원자의 실제 IP(나중에 IP 기준 요청 제한·대시보드 IP 제한·로그에 씀)
        # X-Forwarded-Proto: http/https 구분(관리자 쿠키 secure 설정 0-6에서 씀)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 답변 대기 시간 — 기본값 60초면 LLM 재시도(llm_client: 60초 × 최대 3번)가 겹칠 때 nginx가 먼저 끊어 504가 남.
        # 실측 평균 2.5초, 긴 답도 10초 안팎이지만 GPU가 바쁠 때를 위해 넉넉히 150초(field_test/run.py의 대기 시간과 같음).
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
}
