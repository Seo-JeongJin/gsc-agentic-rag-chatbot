# nginx 설정 ② — https (2026-11-11 배포 0-2, 0-5에서 관리자 영역 IP 제한).
#
# 언제 쓰나: Let's Encrypt 인증서를 받은 뒤 계속(.env에 NGINX_CONF=nginx.https.conf). 첫 발급 순서는 deploy/init-https.sh.
# 왜 https가 필요한가: 학과 홈페이지(gsc.yju.ac.kr)가 https라서, 거기 붙은 위젯이 http 주소로 질문을 보내면
#                    브라우저가 "혼합 콘텐츠"로 차단함. 챗봇도 https여야 위젯이 동작함.
# 왜 도메인(aihub.yju.ac.kr)이 필요했나: 인증서는 이름 기준으로 발급됨 — 숫자 IP로는 받기 어려움.
#
# 인증서 경로(/etc/letsencrypt/live/aihub.yju.ac.kr/)는 certbot 컨테이너와 같이 쓰는 볼륨(certbot_conf). 갱신은 certbot 컨테이너가
# 하루 두 번 확인하고, nginx는 6시간마다 설정을 다시 읽어 새 인증서를 반영함(docker-compose.yml 참고).
# HSTS(브라우저가 "이 주소는 앞으로 https만" 기억)는 일부러 안 켬 — 켜면 문제가 생겨도 http로 되돌리기 어려워서, 안정화된 뒤에 결정.

server_tokens off;   # nginx 버전 숨김(nginx.http.conf와 같은 이유)

# ── 80번: 인증서 갱신 확인 경로만 응답하고, 나머지는 https로 돌려보냄 ──
server {
    listen 80;
    server_name _;

    # 갱신 때도 Let's Encrypt가 80번으로 확인하러 옴 — 이 경로는 https로 돌려보내지 않고 그대로 응답해야 함
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 301 = "영구 이동" — http://aihub.yju.ac.kr/… 로 온 요청을 같은 경로의 https 주소로 보냄
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443번: https로 받아서 챗봇으로 넘김 ──
server {
    listen 443 ssl;
    http2 on;   # 한 연결로 여러 파일(대시보드 화면 등)을 동시에 받게 — 체감 속도 개선
    server_name aihub.yju.ac.kr;

    ssl_certificate     /etc/letsencrypt/live/aihub.yju.ac.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aihub.yju.ac.kr/privkey.pem;
    # 오래되어 안전하지 않은 TLS 1.0·1.1은 끔(요즘 브라우저는 전부 1.2·1.3 지원)
    ssl_protocols TLSv1.2 TLSv1.3;
    # 재접속 때 암호화 협상을 다시 하지 않게 잠깐 기억 — 같은 사용자가 질문을 이어서 할 때 빨라짐
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 64k;   # nginx.http.conf와 같은 이유(질문 1000자 + JSON)

    # 챗봇으로 넘길 때 공통 설정 — 이유는 nginx.http.conf 주석 참고. 여기선 X-Forwarded-Proto가 "https"로 넘어감
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;

    # ── 공개 경로(누구나): 위젯이 쓰는 것만 ──
    location /api/ {            # 질문·평가·새 대화 — 지원자 휴대폰에서 옴
        proxy_pass http://backend:8080;
    }
    location /widget-test/ {    # 위젯 파일 — 학과 홈페이지가 불러감
        proxy_pass http://backend:8080;
    }

    # ── 그 외 전부(관리자 영역): 대시보드 화면·/admin/ 데이터·/docs 등 → 허용 IP만(0-5, 교수님 결정: 학교 안에서만) ──
    location / {
        include /etc/nginx/admin-allow.conf;
        proxy_pass http://backend:8080;
    }
}
