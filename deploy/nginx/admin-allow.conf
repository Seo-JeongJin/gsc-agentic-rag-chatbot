# 관리자 영역 허용 IP 목록 (2026-11-11 배포 0-5) — nginx 설정의 "그 외 전부" 경로(location /)에서 include함.
#
# 무엇을 막나: 대시보드 화면(/), 대시보드 데이터(/admin/...), FastAPI 설명서(/docs, /redoc, /openapi.json) 등
#             공개 경로(/api/, /widget.js, /widget-test/, 인증서 확인 경로)가 아닌 모든 곳. 공개할 곳만 열고 나머지를 막는 방식이라
#             나중에 관리자 기능이 늘어도 자동으로 막힘.
# 왜: 교수님 결정(11-11) — 대시보드는 학교 안에서만 보면 됨. 밖에서는 로그인 화면 자체가 안 보이게(403).
#
# ⚠️ 지금은 "모두 허용" — 학교 PC가 GPU 서버에 어떤 IP로 보이는지 아직 몰라서, 먼저 막으면 우리도 못 들어감.
# 배포 후 채우는 순서:
#   1) 학과 PC에서 https://aihub.yju.ac.kr/ 접속
#   2) 서버에서 접속 기록 확인:  docker compose --profile deploy logs nginx | tail -20   (맨 앞 숫자가 접속한 IP)
#   3) 아래 "allow all;"을 지우고 그 IP를 적은 뒤 맨 끝에 "deny all;"   예)
#        allow 210.101.247.14;     # 학과 PC들(공용 주소)
#        deny  all;
#   4) 적용:  docker compose --profile deploy exec nginx nginx -s reload
#   5) 휴대폰(LTE)으로 https://aihub.yju.ac.kr/ → 403이면 성공, 위젯 질문은 그대로 되는지도 확인
allow all;
