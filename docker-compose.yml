# 비밀번호 등 접속 정보는 이 파일에 직접 쓰지 않고, 같은 폴더의 .env에서 읽어옴
# (docker compose가 .env를 자동으로 읽어 ${...} 자리에 채워 넣음). .env가 없거나 값이 비어 있으면
# ":?" 문법 때문에 실행 자체가 에러로 멈춤 — 빈 비밀번호로 조용히 뜨는 사고 방지.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env에 POSTGRES_USER가 필요합니다}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD가 필요합니다}
      POSTGRES_DB: ${POSTGRES_DB:?.env에 POSTGRES_DB가 필요합니다}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  mcp_server:
    build: ./mcp_server
    container_name: rag_mcp_server
    environment:
      # db 서비스는 같은 Docker 네트워크 안이라 "db"라는 이름으로 서로 찾을 수 있음(localhost 아님)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "9000:9000"
    volumes:
      # BGE-M3 모델 캐시를 볼륨으로 빼둠 — 컨테이너를 다시 만들어도 모델을 매번 재다운로드 안 하게
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: rag_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MCP_SERVER_URL: http://mcp_server:9000/mcp
    ports:
      - "8080:8080"
    depends_on:
      - db
      - mcp_server

volumes:
  pgdata:
  hf_cache:
